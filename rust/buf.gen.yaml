# Message types (buffa). Only the protos the sink needs: the RPC messages and what they reference.
# Service stubs are generated separately, see buf.gen.connect.yaml.
version: v2
inputs:
  - module: buf.build/streamingfast/substreams:v1.18.1
    paths:
      - sf/substreams/rpc/v2
      - sf/substreams/rpc/v3
      - sf/substreams/rpc/v4
      - sf/substreams/v1
    exclude_paths:
      - sf/substreams/v1/test
plugins:
  - remote: buf.build/anthropics/buffa:v0.9.2
    out: src/pb
    opt:
      - views=true
      - json=false
      - unknown_fields=false
