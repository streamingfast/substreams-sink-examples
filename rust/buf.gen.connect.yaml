# gRPC stubs (connectrpc) for the `Stream` service (rpc v4) the sink calls. Message types come
# from `crate::pb`, generated by buf.gen.yaml.
version: v2
inputs:
  - module: buf.build/streamingfast/substreams:v1.18.1
    paths:
      - sf/substreams/rpc/v4
plugins:
  - remote: buf.build/connectrpc/rust:v0.9.0
    out: src/pb_connect
    opt:
      - buffa_module=crate::pb
      - no_json
